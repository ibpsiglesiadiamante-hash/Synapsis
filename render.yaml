# Render Infrastructure-as-Code Blueprint
# Synapsis ERP — Sistema de Gestión Integral Institucional y Académica

services:
  - type: web
    name: synapsis-erp
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      # SPA Rewrite: Redirige todas las rutas hacia index.html para permitir navegación fluida en React
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://hbkgtsqeeudpwewopazy.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable_oQR6cQ6PydzcYtKVKlVtbQ_OkCHjvhK
